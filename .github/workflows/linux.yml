name: compile xfrpc in ubuntu-latest

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '编译xfrpc源码的分支或版本号，默认主分支master'
        required: true
        default: 'dynamic'
      del:
        description: '是否删除历史编译的流程记录'
        required: true
        default: false
        type: boolean
      rel:
        description: '编译完成后是否发布Release'
        required: true
        default: false
        type: boolean
      tag:
        description: '指定Release的版本号（留空为源码提交哈希值）'
        required: false
        default: ''
      debug:
        description: '是否启用 DEBUG 模式（保留 XFRPC_DEBUG 详细日志并加 -g；默认 OFF 走 -Os 体积优化）'
        required: false
        default: false
        type: boolean

env:
  # 依赖库版本 - 统一在此修改
  MBEDTLS_VER: 3.6.5
  JSONC_VER: 0.19
  JSONC_TAG: json-c-0.19-20260627
  LIBEVENT_VER: 2.2.2-alpha
  LIBEVENT_TAG: release-2.2.2-alpha

  branch: "${{ github.event.inputs.branch }}"
  tag: "${{ github.event.inputs.tag }}"
  rel: "${{ github.event.inputs.rel }}"
  debug: "${{ github.event.inputs.debug }}"
  TZ: Asia/Shanghai

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
        # - target: aarch64-linux-musl
        #   os: ubuntu-latest
        #   URL: aarch64-linux-musl
        #   ARCH_FLAG: linux-aarch64

        - target: x86_64-linux-musl
          os: ubuntu-latest
          URL: x86_64-linux-musl
          ARCH_FLAG: linux-x86_64
          # 工具链类型: musl（dl-musl action 下载）/ uclibc（thingino SDK 解压）
          TC: musl

        # - target: i686-linux-musl
        #   os: ubuntu-latest
        #   URL: i686-linux-musl
        #   ARCH_FLAG: linux-generic32

        # - target: armv7-linux-musleabihf
        #   os: ubuntu-latest
        #   URL: armv7l-linux-musleabihf
        #   ARCH_FLAG: linux-armv4

        # - target: armv7-linux-musleabi
        #   os: ubuntu-latest
        #   URL: armv7m-linux-musleabi
        #   ARCH_FLAG: linux-armv4

        # - target: arm-linux-musleabihf
        #   os: ubuntu-latest
        #   URL: arm-linux-musleabihf
        #   ARCH_FLAG: linux-armv4

        # - target: arm-linux-musleabi
        #   os: ubuntu-latest
        #   URL: arm-linux-musleabi
        #   ARCH_FLAG: linux-armv4

        - target: mipsel-linux-musl
          os: ubuntu-latest
          URL: mipsel-linux-muslsf
          ARCH_FLAG: linux-mips32
          TC: musl
          # 目标设备（xfp301m 等厂商固件）musl 加载器路径无 -sf 后缀，
          # 与 muslsf 工具链默认的 /lib/ld-musl-mipsel-sf.so.1 不同，需显式指定
          LOADER: /lib/ld-musl-mipsel.so.1

        # xfp301m 实测为 uClibc 固件（/usr/lib 只有 ld-uClibc-1.0.58.so、libc.so.0，
        # 无 ld-musl-*），musl 二进制运行报 "not found"（ELF interpreter 不存在）。
        # 改用 thingino 的 Ingenic xburst1 uClibc SDK 工具链编译，
        # 二进制直接链接设备自带的 uClibc 运行时（uClibc 1.0.58 / gcc15，与设备一致）
        # 如默认加载器路径与设备不符，可仿照 musl 项加 LOADER 显式指定
        - target: mipsel-linux-uclibc
          os: ubuntu-latest
          URL: ''
          ARCH_FLAG: linux-mips32
          TC: uclibc
          TC_URL: https://github.com/themactep/thingino-firmware/releases/download/toolchain-x86_64/thingino-toolchain-x86_64_xburst1_uclibc_gcc15-linux-mipsel.tar.gz

        # - target: mips-linux-musl
        #   os: ubuntu-latest
        #   URL: mips-linux-muslsf
        #   ARCH_FLAG: linux-mips32

    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout xfrpc 源码
      uses: actions/checkout@main
      with:
        repository: iborderxm/xfrpc
        ref: ${{ env.branch }}

    - name: 下载 musl-gcc 交叉编译工具链
      if: matrix.TC == 'musl'
      uses: lmq8267/dl-musl@main
      with:
        target: ${{ matrix.URL }}
        static: true
        gccpath: /tmp

    # thingino uClibc SDK（buildroot 布局）：
    # 解压后自动探测交叉编译器前缀（不依赖工具链内部目录命名），
    # 通过 GITHUB_ENV 导出 CC/AR/RANLIB/STRIP 等变量（与 dl-musl 提供的变量名一致），
    # 后续依赖库 / xfrpc 编译步骤无需感知两种工具链的差异
    - name: 下载 thingino uClibc SDK 交叉编译工具链
      if: matrix.TC == 'uclibc'
      run: |
        set -e
        TC_ROOT=/tmp/uctc
        mkdir -p $TC_ROOT
        echo -e "\n\033[36m==> 下载 thingino uClibc SDK 工具链 (xburst1/gcc15/mipsel)\033[0m"
        curl -fL --retry 3 "${{ matrix.TC_URL }}" -o /tmp/uctc.tar.gz
        tar xzf /tmp/uctc.tar.gz -C $TC_ROOT

        # 自动探测交叉编译器（兼容顶层带/不带目录两种打包布局）
        GCC_PATH=$(find $TC_ROOT \( -type f -o -type l \) -path '*/bin/*-gcc' | head -n1)
        if [ -z "$GCC_PATH" ]; then
          echo "::error::工具链中未找到 *-gcc"; exit 1
        fi
        TC_BIN=$(cd "$(dirname "$GCC_PATH")" && pwd)
        CROSS=$(basename "$GCC_PATH"); CROSS=${CROSS%-gcc}
        echo "工具链 bin 目录: $TC_BIN"
        echo "编译器前缀: $CROSS"

        # 关键工具齐全性检查
        for t in gcc cpp ar ld ranlib strip; do
          if [ ! -e "$TC_BIN/$CROSS-$t" ]; then
            echo "::error::工具链缺少 $CROSS-$t"; exit 1
          fi
        done

        # 导出给后续步骤（注意：GITHUB_ENV 对本步骤不生效，冒烟测试用绝对路径）
        {
          echo "CC=$TC_BIN/$CROSS-gcc"
          echo "CPP=$TC_BIN/$CROSS-cpp"
          echo "AR=$TC_BIN/$CROSS-ar"
          echo "LD=$TC_BIN/$CROSS-ld"
          echo "RANLIB=$TC_BIN/$CROSS-ranlib"
          echo "STRIP=$TC_BIN/$CROSS-strip"
        } >> $GITHUB_ENV
        echo "$TC_BIN" >> $GITHUB_PATH
        if [ -e "$TC_BIN/$CROSS-g++" ]; then
          echo "CXX=$TC_BIN/$CROSS-g++" >> $GITHUB_ENV
        fi

        # 冒烟测试：确认产出 mipsel + uClibc 动态链接 ELF（interpreter 应为 ld-uClibc）
        echo 'int main(void){return 0;}' > /tmp/smoke.c
        $TC_BIN/$CROSS-gcc /tmp/smoke.c -o /tmp/smoke
        file /tmp/smoke
        rm -f /tmp/smoke /tmp/smoke.c /tmp/uctc.tar.gz

    - name: 恢复依赖库编译缓存
      id: cache-sysroot
      uses: actions/cache@v4
      with:
        path: /tmp/sysroot
        key: xfrpc-sysroot-${{ matrix.target }}-dynamic-${{ hashFiles('.github/workflows/linux.yml') }}
        restore-keys: |
          xfrpc-sysroot-${{ matrix.target }}

    - name: 交叉编译所有依赖库 (mbedTLS + json-c + libevent)
      if: steps.cache-sysroot.outputs.cache-hit != 'true'
      id: build-deps
      run: |
        SYSROOT=/tmp/sysroot
        mkdir -p $SYSROOT

        # 从交叉编译器获取目标三元组（仅用于日志）
        TARGET_TRIPLE=$($CC -dumpmachine)
        echo "目标三元组: $TARGET_TRIPLE"
        echo "编译器: $CC"

        # 设置公共编译和链接标志
        COMMON_CFLAGS="-I${SYSROOT}/include -Os -ffunction-sections -fdata-sections"
        COMMON_LDFLAGS="-L${SYSROOT}/lib -Wl,--gc-sections"

        # STATIC_LIBRARY 让 try-compile 只编译不链接，check_symbol_exists 等符号
        # 检测会"假通过"：musl 自带 getrandom/arc4random 所以无碍，但 uClibc 没有，
        # 假通过会让 json-c/libevent 静态库引用设备 libc 不存在的符号，
        # 在最终链接 xfrpc（或编译 json-c 自带测试）时报 undefined reference。
        # 故 uClibc 走真实链接检测，各库自动回退到 /dev/urandom 等实现。
        TRY_COMPILE_FLAG="-DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY"
        if [ "${{ matrix.TC }}" = "uclibc" ]; then
          TRY_COMPILE_FLAG=""
        fi

        # ============================================================
        # 1. 编译 mbedTLS ${{ env.MBEDTLS_VER }} — TLS 后端 + 加密原语
        #    xfrpc tls.c 经 libevent bufferevent_mbedtls 使用 mbedTLS，
        #    crypto 层使用 PBKDF2/AES-128-CFB/MD5/CTR_DRBG。
        #    同时构建静态(.a，供 libevent 编译)与动态(.so，供 xfrpc 链接)。
        # ============================================================
        echo -e "\n\033[36m===== [1/3] 编译 mbedTLS =====\033[0m"
        mkdir mbedtls-src && \
          curl -sL https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-${{ env.MBEDTLS_VER }}/mbedtls-${{ env.MBEDTLS_VER }}.tar.bz2 | \
          tar xj -C mbedtls-src --strip-components=1
        cd mbedtls-src
        cmake -B build -DCMAKE_C_COMPILER=$CC \
          -DCMAKE_SYSTEM_NAME=Linux \
          -DCMAKE_INSTALL_PREFIX=$SYSROOT \
          -DCMAKE_INSTALL_LIBDIR=lib \
          -DCMAKE_INSTALL_INCLUDEDIR=include \
          -DBUILD_SHARED_LIBS=OFF \
          -DENABLE_TESTING=OFF -DENABLE_PROGRAMS=OFF \
          -DUSE_SHARED_MBEDTLS_LIBRARY=ON -DUSE_STATIC_MBEDTLS_LIBRARY=ON \
          -DMBEDTLS_FATAL_WARNINGS=OFF \
          $TRY_COMPILE_FLAG \
          -DCMAKE_FIND_ROOT_PATH=$SYSROOT \
          -DCMAKE_C_FLAGS="$COMMON_CFLAGS" \
          -DCMAKE_EXE_LINKER_FLAGS="$COMMON_LDFLAGS"
        cmake --build build -j$(nproc)
        cmake --install build
        cd ..
        echo -e "\n\033[32m✓ mbedTLS 编译完成（静态 + 动态）\033[0m"
        ls -lh $SYSROOT/lib/libmbed*.a $SYSROOT/lib/libmbed*.so*

        # ============================================================
        # 2. 编译 json-c ${{ env.JSONC_VER }} — JSON 解析库
        # ============================================================
        echo -e "\n\n\n\033[36m===== [2/3] 编译 json-c =====\033[0m"
        mkdir jsonc-src && \
          curl -sL https://github.com/json-c/json-c/releases/download/${{ env.JSONC_TAG }}/json-c-${{ env.JSONC_VER }}-nodoc.tar.gz | \
          tar xz -C jsonc-src --strip-components=1
        cd jsonc-src
        # 注意是 BUILD_TESTING（include(CTest) 的标准开关）：
        # BUILD_TESTS 对 json-c 无效，会导致测试程序被编译（uClibc 下链接失败）
        cmake -B build -DCMAKE_C_COMPILER=$CC \
          -DCMAKE_INSTALL_PREFIX=$SYSROOT \
          -DBUILD_SHARED_LIBS=OFF \
          -DBUILD_TESTING=OFF -DDISABLE_BSYMBOLIC=ON \
          $TRY_COMPILE_FLAG \
          -DCMAKE_C_FLAGS="$COMMON_CFLAGS"
        cmake --build build -j$(nproc)
        cmake --install build
        cd ..
        echo -e "\n\033[32m✓ json-c 编译完成\033[0m"
        ls -lh $SYSROOT/lib/libjson-c.a

        # ============================================================
        # 3. 编译 libevent ${{ env.LIBEVENT_VER }} — 事件循环库
        #    2.2.x 起提供 event_mbedtls（bufferevent_mbedtls_*）TLS 后端；
        #    关闭 OpenSSL 后端，强制启用 mbedTLS 后端。
        # ============================================================
        echo -e "\n\n\n\033[36m===== [3/3] 编译 libevent =====\033[0m"
        mkdir libevent-src && \
          curl -sL https://github.com/libevent/libevent/releases/download/${{ env.LIBEVENT_TAG }}/libevent-${{ env.LIBEVENT_VER }}.tar.gz | \
          tar xz -C libevent-src --strip-components=1
        cd libevent-src
        cmake -B build -DCMAKE_C_COMPILER=$CC \
          -DCMAKE_INSTALL_PREFIX=$SYSROOT \
          -DBUILD_SHARED_LIBS=OFF \
          -DEVENT__DISABLE_TESTS=ON -DEVENT__DISABLE_SAMPLES=ON -DEVENT__DISABLE_REGRESS=ON \
          -DEVENT__DISABLE_OPENSSL=ON \
          -DEVENT__DISABLE_MBEDTLS=OFF \
          -DMBEDTLS_INCLUDE_DIR=$SYSROOT/include \
          -DMBEDTLS_LIBRARY=$SYSROOT/lib/libmbedtls.a \
          -DMBEDTLS_X509_LIBRARY=$SYSROOT/lib/libmbedx509.a \
          -DMBEDTLS_CRYPTO_LIBRARY=$SYSROOT/lib/libmbedcrypto.a \
          -DCMAKE_SHARED_LIBRARY_LINK_C_FLAGS="" \
          $TRY_COMPILE_FLAG \
          -DCMAKE_C_FLAGS="$COMMON_CFLAGS" \
          -DCMAKE_EXE_LINKER_FLAGS="$COMMON_LDFLAGS"
        # 只编译静态库，跳过共享库（避免 -static 与 .so 链接冲突）
        cmake --build build -j$(nproc) \
          --target event_core_static \
          --target event_extra_static \
          --target event_mbedtls_static \
          --target event_pthreads_static \
          --target event_static
        # cmake --install 会尝试安装不存在的 .so，手动复制所需文件
        cp build/lib/libevent*.a $SYSROOT/lib/
        cp -r include/* $SYSROOT/include/
        # 复制 cmake 生成的 config header（不在源码中）
        cp build/include/event2/event-config.h $SYSROOT/include/event2/
        echo -e "\n\033[32m✓ libevent 编译完成（event_mbedtls 后端）\033[0m"
        ls -lh $SYSROOT/lib/libevent*.a

    - name: 编译 xfrpc
      id: build-xfrpc
      run: |
        SYSROOT=/tmp/sysroot
        mkdir -p bin && cd bin

        # 清空 dl-musl 注入的环境变量（含 -static 与工具链 -I/-L 路径），
        # 否则 xfrpc 无法动态链接 mbedTLS（attempted static link of dynamic object）
        unset CFLAGS CXXFLAGS CPPFLAGS LDFLAGS

        # 构建完整的编译标志（上游有 -Werror，需加 -Wno-* 绕过假阳性）
        # mbedTLS 为动态链接：$ORIGIN rpath 使 .so 与二进制同目录即可运行
        COMMON_CFLAGS="-I${SYSROOT}/include -Os -ffunction-sections -fdata-sections -Wno-error=array-bounds"
        COMMON_LDFLAGS="-L${SYSROOT}/lib -Wl,--gc-sections -Wl,-rpath,\$ORIGIN"
        # 仅当 matrix 显式配置 LOADER 时才覆盖动态加载器路径
        # （目标设备加载器命名与工具链默认 PT_INTERP 不一致时使用，如 xfp301m）
        LOADER="${{ matrix.LOADER }}"
        if [ -n "$LOADER" ]; then
          COMMON_LDFLAGS="$COMMON_LDFLAGS -Wl,--dynamic-linker=$LOADER"
        fi

        # ENABLE_PLUGINS=OFF：内嵌目标无需 builtin 插件（telnetd/httpd 等），省 100KB+ text
        # DEBUG 由 workflow_dispatch inputs.debug 控制（默认 OFF）：
        # ON  保留 XFRPC_DEBUG 详细日志 + -g；OFF 走 CMakeLists 的 -Os 体积优化
        if [ "$debug" = "true" ]; then DEBUG_FLAG=ON; else DEBUG_FLAG=OFF; fi
        cmake \
          -DCMAKE_C_COMPILER=$CC \
          -DCMAKE_C_FLAGS="$COMMON_CFLAGS $CFLAGS" \
          -DCMAKE_EXE_LINKER_FLAGS="$COMMON_LDFLAGS $LDFLAGS -Wl,--start-group" \
          -DCMAKE_FIND_ROOT_PATH=$SYSROOT \
          -DLIBEVENT_INCLUDE_DIR=$SYSROOT/include \
          -DLIBEVENT_LIB=$SYSROOT/lib/libevent.a \
          -DLIBEVENT_CORE_LIB=$SYSROOT/lib/libevent_core.a \
          -DLIBEVENT_PTHREADS_LIB=$SYSROOT/lib/libevent_pthreads.a \
          -DLIBEVENT_EXTRA_LIB=$SYSROOT/lib/libevent_extra.a \
          -DLIBEVENT_MBEDTLS_LIB=$SYSROOT/lib/libevent_mbedtls.a \
          -DJSON-C_INCLUDE_DIR=$SYSROOT/include \
          -DJSON-C_LIBRARY=$SYSROOT/lib/libjson-c.a \
          -DMBEDTLS_INCLUDE_DIR=$SYSROOT/include \
          -DMBEDTLS_LIBRARY=$SYSROOT/lib/libmbedtls.so \
          -DMBEDX509_LIBRARY=$SYSROOT/lib/libmbedx509.so \
          -DMBEDCRYPTO_LIBRARY=$SYSROOT/lib/libmbedcrypto.so \
          -DENABLE_PLUGINS=OFF \
          -DDEBUG=$DEBUG_FLAG \
          ..

        make -j$(nproc)
        $STRIP xfrpc
        du -m xfrpc || true
        file xfrpc

        # 记录二进制大小
        SIZE=$(stat -c%s xfrpc 2>/dev/null || echo 0)
        echo "SIZE_XFRPC=$SIZE" >> $GITHUB_ENV
        echo -e "\n\033[32m✓ xfrpc 编译完成！大小: $SIZE 字节\033[0m"

    - name: 输出编译摘要到 GITHUB_STEP_SUMMARY
      run: |
        BUILD_TIME=$(date '+%Y-%m-%d %H:%M:%S')
        SYSROOT=/tmp/sysroot
        FILE_INFO=$(file bin/xfrpc | sed 's/|//g')

        # 从文件直接读取库大小（mbedTLS 为三个静态库合计）
        SZ_MBEDTLS_STATIC=$(( \
          $(stat -c%s $SYSROOT/lib/libmbedtls.a  2>/dev/null || echo 0) + \
          $(stat -c%s $SYSROOT/lib/libmbedx509.a 2>/dev/null || echo 0) + \
          $(stat -c%s $SYSROOT/lib/libmbedcrypto.a 2>/dev/null || echo 0) ))
        SZ_MBEDTLS_DYNAMIC=$(( \
          $(stat -c%s $SYSROOT/lib/libmbedtls.so  2>/dev/null || echo 0) + \
          $(stat -c%s $SYSROOT/lib/libmbedx509.so 2>/dev/null || echo 0) + \
          $(stat -c%s $SYSROOT/lib/libmbedcrypto.so 2>/dev/null || echo 0) ))
        
        SZ_JSONC=$(stat -c%s $SYSROOT/lib/libjson-c.a 2>/dev/null || echo 0)
        SZ_LIBEVENT=$(stat -c%s $SYSROOT/lib/libevent_core.a 2>/dev/null || echo 0)
        SZ_XFRPC=$(stat -c%s bin/xfrpc 2>/dev/null || echo 0)

        cat >> $GITHUB_STEP_SUMMARY << SUMMARYEOF
        ## ✅ xfrpc 静态交叉编译完成

        | 项目 | 值 |
        |------|-----|
        | 架构 | ${{ matrix.target }} |
        | 编译时间 | ${BUILD_TIME} |
        | 链接方式 | ${{ matrix.TC }}：mbedTLS 动态，json-c/libevent 静态 |
        | 缓存命中 | ${{ steps.cache-sysroot.outputs.cache-hit }} |
        | TLS/加密后端 | mbedTLS ${{ env.MBEDTLS_VER }} |
        | libevent | ${{ env.LIBEVENT_VER }} (event_mbedtls) |
        | 编译优化 | \`-Os -ffunction-sections -fdata-sections -Wl,--gc-sections\` |
        | 无用符号裁剪 | 已启用 (gc-sections) |
        | 文件类型 | ${FILE_INFO} |

        ### 依赖库体积

        | 依赖库 | 版本 | 大小 |
        |--------|------|-----------|
        | mbedTLS (tls+x509+crypto) | ${{ env.MBEDTLS_VER }} | ${SZ_MBEDTLS_DYNAMIC} 字节（动态 libmbed*.so） |
        | json-c | ${{ env.JSONC_VER }} | ${SZ_JSONC} 字节（静态） |
        | libevent | ${{ env.LIBEVENT_VER }} | ${SZ_LIBEVENT} 字节（静态） |

        ### 编译产物

        | 文件 | 大小 | 说明 |
        |------|------|------|
        | \`xfrpc-${{ matrix.target }}\` | ${SZ_XFRPC} 字节 | 原始二进制（内嵌 \$ORIGIN rpath） |
        | \`xfrpc-${{ matrix.target }}_upx\` | （见后） | UPX 压缩版，二选一下载即可 |
        | \`libmbed*.so*\` | 见上表 | 运行时动态库，必须与 xfrpc 同目录 |
        SUMMARYEOF

        # 保存到环境变量供后续步骤使用
        echo "SIZE_XFRPC=$SZ_XFRPC" >> $GITHUB_ENV

    - name: 安装 UPX
      uses: crazy-max/ghaction-upx@v3
      with:
        version: v4.2.4
        install-only: true

    - name: UPX 压缩并打包动态库
      run: |
        SYSROOT=/tmp/sysroot
        cd bin
        # 所有目标统一命名: xfrpc-$TARGET / xfrpc-$TARGET_upx
        cp xfrpc xfrpc-${{ matrix.target }}_upx
        mv xfrpc xfrpc-${{ matrix.target }}
        upx --lzma --best xfrpc-${{ matrix.target }}_upx || {
          echo "UPX 压缩失败（动态链接 ELF 可能不受支持），跳过压缩版"
          rm -f xfrpc-${{ matrix.target }}_upx
        }
        # 复制运行时动态库（mbedTLS 动态链接，rpath=$ORIGIN，需与二进制同目录）
        # cp -L 解引用符号链接，保证所有 SONAME 文件名齐全
        cp -L $SYSROOT/lib/libmbedtls.so* .
        cp -L $SYSROOT/lib/libmbedx509.so* .
        cp -L $SYSROOT/lib/libmbedcrypto.so* .
        $STRIP --strip-unneeded lib*.so*
        echo -e "\n\033[32m✓ 动态库打包完成\033[0m"
        ls -lh

    - name: 追加 UPX 结果到摘要
      run: |
        SZ_UPX=$(stat -c%s bin/xfrpc-${{ matrix.target }}_upx 2>/dev/null || echo 0)
        SZ_XFRPC=${SIZE_XFRPC:-0}
        echo "| \`xfrpc-${{ matrix.target }}_upx\` | ${SZ_UPX} 字节 | UPX 压缩版，二选一下载即可 |" >> $GITHUB_STEP_SUMMARY
        if [ "$SZ_XFRPC" -gt 0 ] && [ "$SZ_UPX" -gt 0 ]; then
          COMPRESS_RATE=$(( (SZ_XFRPC - SZ_UPX) * 100 / SZ_XFRPC ))
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 原始: ${SZ_XFRPC} 字节 → **UPX: ${SZ_UPX} 字节**（压缩率 **${COMPRESS_RATE}%**）" >> $GITHUB_STEP_SUMMARY
          echo "> 两者功能完全相同，二选一即可。UPX 版首次运行时会自动解压。" >> $GITHUB_STEP_SUMMARY
        fi
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "> 🤖 由 GitHub Actions 自动编译 | 源码: liudf0716/xfrpc@${{ env.branch }}" >> $GITHUB_STEP_SUMMARY

    - uses: actions/upload-artifact@v4
      with:
        name: xfrpc-${{ env.branch }}-${{ matrix.target }}
        path: bin/*

    - name: 打包 (准备 Release)
      if: github.event.inputs.rel == 'true'
      shell: bash
      run: |
        echo "build_time=$(date '+%Y年%m月%d日%H:%M:%S' | jq -sRr @uri)" >> $GITHUB_ENV
        if [ -z "$TAG" ]; then
          echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        fi
        echo "haxi=$(git rev-parse HEAD)" >> $GITHUB_ENV
      env:
        TAG: ${{ env.tag }}
        TARGET: ${{ matrix.target }}

    - name: 发布 Release
      if: github.event.inputs.rel == 'true'
      uses: lmq8267/action-gh-release@master
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        body: |
         > ### ![](https://img.shields.io/badge/%E7%BC%96%E8%AF%91%E6%97%B6%E9%97%B4-${{ env.build_time }}-8267?logo=github&labelColor=%E9%A1%BB)![](https://img.shields.io/github/downloads/${{ github.repository }}/${{env.tag}}/total?label=%E4%B8%8B%E8%BD%BD%E6%AC%A1%E6%95%B0&logo=github)

         ### 依赖库版本

         | 依赖库 | 版本 | 链接方式 |
         |--------|------|----------|
         | mbedTLS | ${{ env.MBEDTLS_VER }} | 动态 (libmbed*.so) |
         | json-c | ${{ env.JSONC_VER }} | 静态 |
         | libevent | ${{ env.LIBEVENT_VER }} | 静态 |

         ### 构建信息

         - **架构**: ${{ matrix.target }}
         - **链接方式**: mbedTLS 动态链接，json-c/libevent 静态链接（${{ matrix.TC }}）
         - **TLS/加密后端**: mbedTLS ${{ env.MBEDTLS_VER }}（libevent event_mbedtls）
         - **编译优化**: \`-Os -ffunction-sections -fdata-sections -Wl,--gc-sections\`

         ### 编译产物

         本 Release 包含两个版本的可执行文件：

         | 文件 | 说明 |
         |------|------|
         | \`xfrpc-${{ matrix.target }}\` | 原始编译二进制（strip 后），可直接运行 |
         | \`xfrpc-${{ matrix.target }}_upx\` | UPX --lzma --best 压缩版，体积更小 |
         | \`libmbed*.so*\` | 运行时动态库，需与 xfrpc 放同一目录（rpath=$ORIGIN） |

         > 两者功能完全相同，**二选一下载即可**。UPX 版首次运行时会自动解压。
         > 下载后请先执行 \`chmod +x xfrpc-*\` 赋予执行权限。
         > 注意：需对应 libc 运行环境（musl: OpenWrt 等默认自带；uClibc: 目标设备固件自带），且同目录必须保留所有 \`lib*.so*\` 动态库文件。

         [提交记录](https://github.com/liudf0716/xfrpc/tree/${{ env.haxi }})

         > 🤖 由 GitHub Actions 自动编译 | [源码](https://github.com/liudf0716/xfrpc): liudf0716/xfrpc@${{ env.branch }}

        tag_name: ${{env.tag}}
        files: |
          bin/xfrpc-${{ matrix.target }}*
          bin/lib*.so*

  del:
    runs-on: ubuntu-latest
    steps:
    - name: 删除旧的流程记录
      if: github.event.inputs.del == 'true'
      uses: Mattraks/delete-workflow-runs@main
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        retain_days: 0
        keep_minimum_runs: 0